name: Live booking sync smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke production sync twice
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"')
          SUPABASE_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')
          TEST_ID="TEST-LIVE-SYNC-20260818-001"
          cat > /tmp/payload.json <<'JSON'
          {
            "action":"append_booking",
            "booking":{
              "id":"TEST-LIVE-SYNC-20260818-001",
              "created_at":"2026-08-18T22:45:00+03:00",
              "status":"test-live",
              "car_label":"TEST LIVE CAR",
              "date_from":"2026-08-29",
              "date_to":"2026-08-30",
              "days":1,
              "last_name":"Тест",
              "first_name":"Интеграция",
              "middle_name":"",
              "phone":"+70000000001",
              "email":"live-test@example.invalid",
              "passport_series":"",
              "passport_number":"",
              "passport_date":"",
              "passport_code":"",
              "license_number":"",
              "license_date":"",
              "city":"Альметьевск",
              "delivery_time":"12:00",
              "age_category":"test",
              "experience_category":"test",
              "selected_extras":[],
              "daily_rate":1,
              "extras_cost":0,
              "total_cost":1,
              "prepay":0,
              "remaining":1,
              "deposit":0,
              "promo_code":"TEST",
              "payment_method":"test",
              "preferred_messenger":"test"
            }
          }
          JSON
          for N in 1 2; do
            curl --fail-with-body -sS \
              -X POST "$SUPABASE_URL/functions/v1/sync-google-sheets" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json > "/tmp/response${N}.json"
            echo "Response $N:"
            cat "/tmp/response${N}.json"
            echo
          done
          grep -q '"success":true' /tmp/response1.json
          grep -Eq '"action":"(inserted|updated)"' /tmp/response1.json
          grep -q '"action":"updated"' /tmp/response2.json
